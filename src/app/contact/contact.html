<section class="community-contact">

<div class="container">

<h2 class="section-title">Contact & Community</h2>
<p class="section-subtitle">Send us a message or ask anime questions</p>

<div class="community-grid">

<!-- Contact Form -->
<div class="contact-box">

<h3>Contact Us</h3>

<form class="contact-form">

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<textarea placeholder="Your message..." rows="4"></textarea>

<button type="submit" class="contact-btn">Send Message</button>

</form>

</div>


<!-- Comment Section -->
<div class="comment-box">

<h3>Community Questions</h3>

<div class="comment-form">
<input type="text" id="username" placeholder="Your name">

<textarea id="commentInput" placeholder="Ask your question about anime..."></textarea>

<button onclick="addComment()" class="comment-btn">Post Question</button>
</div>

<div id="commentList" class="comment-list">

<div class="comment">
<h4>AnimeFan99</h4>
<p>Is Solo Leveling getting a season 2?</p>
</div>

<div class="comment">
<h4>OtakuWorld</h4>
<p>Where can I watch Frieren with English subtitles?</p>
</div>

</div>

</div>

</div>

</div>

</section>
