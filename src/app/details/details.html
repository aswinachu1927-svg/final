<div class="container">

<div class="product-card">

<div class="row">

<div class="col-md-6 text-center">
<img [src]="product.images.jpg.image_url" class="product-img">
</div>

<div class="col-md-6">

<span class="category">{{ product.type }}</span>

<h2>{{ product.title }}</h2>

<div class="rating">
⭐ Score: {{ product.score }}
</div>

<h3>Rank: {{ product.rank }}</h3>

<p>{{ product.synopsis }}</p>

<div class="anime-buttons">

<button class="watch-btn">
 Watch Now
</button>

<button class="list-btn">
 Add to List
</button>

</div>

</div>

</div>

</div>

</div>
<br>
